# `docker compose up -d --build`: the whole stack, API on :8000. `make up`: only Postgres and Redis, for running
# from the host. Ozon (Chromium in the worker): add `-f docker-compose.browser.yml`.
x-env: &env
  DATABASE_URL: postgresql+asyncpg://buysmarter:buysmarter@postgres:5432/buysmarter
  REDIS_URL: redis://redis:6379/0
  BUYSMARTER_SOURCES: ${BUYSMARTER_SOURCES:-kaspi,olx}
  BUYSMARTER_JOB_TIMEOUT_S: ${BUYSMARTER_JOB_TIMEOUT_S:-300}
  # Traces go out only when this is set (`make observe` points it at Jaeger).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-app: &app
  build:
    context: .
    target: runtime
  image: ghcr.io/octrow/buy-smarter:${TAG:-latest}
  env_file:
    - path: .env
      required: false
  environment: *env

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: buysmarter
      POSTGRES_PASSWORD: buysmarter
      POSTGRES_DB: buysmarter
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buysmarter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "8000:8000"
    volumes:
      - cache:/home/app/.cache/buysmarter
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs the recommend jobs the API queues; metrics on :9000.
  worker:
    <<: *app
    command:
      - taskiq
      - worker
      - buysmarter.worker:broker
      - --ack-type=when_executed
      - --workers=1
      - --max-async-tasks=2
      - --no-configure-logging
    environment:
      <<: *env
      BUYSMARTER_LOG_FILE: "-"
    volumes:
      - cache:/home/app/.cache/buysmarter
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:9000/metrics').status != 200)"
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # `make observe`: Prometheus :9090, Grafana :3000 (dashboard "buy-smarter"), Jaeger :16686.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.1.8
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/buysmarter.yml:ro
      - ./deploy/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/buysmarter.yml:ro
      - ./deploy/observability/grafana/buysmarter.json:/etc/grafana/dashboards/buysmarter.json:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  redisdata:
  cache:
