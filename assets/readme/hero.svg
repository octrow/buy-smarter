<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">buy-smarter — explainable shopping assistant for Kazakhstan</title>
  <desc id="desc">Describe what you need in plain words; buy-smarter searches Kaspi, Ozon and OLX and ranks offers for your budget and city. Right: the best pick from a real run, 66 of 100, with the score of every axis.</desc>
  <rect width="1200" height="460" rx="24" fill="#F6F3EC"/>
  <g id="title-block" transform="translate(0 12)">
    <text x="60" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#0E7C6B">KASPI.KZ · OZON.KZ · OLX.KZ</text>
    <text x="56" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#16191D">buy-smarter</text>
    <text x="60" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="#16191D">Describe what you need.</text>
    <text x="60" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" fill="#5F6670">Get offers ranked for your</text>
    <text x="60" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" fill="#5F6670">budget and city, with the</text>
    <text x="60" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" fill="#5F6670">reason behind every score.</text>
    <rect x="60" y="334" width="440" height="64" rx="12" fill="#16191D"/>
    <text x="80" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#F6F3EC">“adapalene 0.1% cream,</text>
    <text x="80" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#F6F3EC">under 10 000 ₸, Almaty”</text>
    <path d="M512 366 H600 M588 356 L602 366 L588 376" stroke="#0E7C6B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
