name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buysmarter
          POSTGRES_PASSWORD: buysmarter
          POSTGRES_DB: buysmarter
        ports: ["5434:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run complexipy src
      - run: uv run pytest -q --cov --cov-fail-under=89

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: ghcr.io/octrow/buy-smarter:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke (compose stack)
        env:
          TAG: ci
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120 || { docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8000/health
          docker compose run --rm app buysmarter doctor | grep -E '^Postgres +ok'
          img=ghcr.io/octrow/buy-smarter:ci
          [ "$(docker run --rm $img id -u)" = 10001 ]
          ! docker run --rm $img ls -a /app | grep -E '^\.(env|git)$'

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      CHART: deploy/helm/buysmarter
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.5
      - name: Lint and validate against the Kubernetes schemas
        run: |
          helm lint "$CHART" --set secret.data.DATABASE_URL=x --set secret.data.REDIS_URL=x
          helm template t "$CHART" --set secret.data.DATABASE_URL=x --set secret.data.REDIS_URL=x \
            --set ingress.enabled=true --set autoscaling.enabled=true --set podDisruptionBudget.enabled=true \
            --set metrics.serviceMonitor.enabled=true --set otel.endpoint=http://collector:4318 \
            | docker run -i --rm "$KUBECONFORM" -strict -summary -kubernetes-version 1.33.0 \
                -schema-location default -schema-location "$CRD_SCHEMAS"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: ghcr.io/octrow/buy-smarter:ci
          load: true
          cache-from: type=gha
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: kind
          wait: 120s
      # The image goes straight into the cluster, no registry: works on PRs from forks too.
      - run: kind load docker-image ghcr.io/octrow/buy-smarter:ci
      - run: deploy/kind/smoke.sh
