name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buysmarter
          POSTGRES_PASSWORD: buysmarter
          POSTGRES_DB: buysmarter
        ports: ["5434:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: buysmarter:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke
        run: |
          docker run -d --name app -p 8000:8000 buysmarter:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/health
          [ "$(docker run --rm buysmarter:ci id -u)" = 10001 ]
          docker run --rm buysmarter:ci buysmarter --help
          ! docker run --rm buysmarter:ci ls -a /app | grep -E '^\.(env|git)$'
