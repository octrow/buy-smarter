# A PyInstaller one-dir desktop build per OS → its --self-test → an archive artifact (desktop-<os>),
# plus the Ubuntu .deb, the Windows setup and the macOS .dmg, each installed (or mounted) and self-tested.
# release.yml calls it on a tag and attaches the archives to the release it creates; run it by hand
# (workflow_dispatch) for a dry run that only builds and self-tests.
name: desktop
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:  # arch as the archive names spell it (lowercased runner.arch)
          - os: ubuntu-22.04  # the oldest glibc we build on is the minimum the Linux build needs
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # release artifacts: no cache that could be poisoned
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: uv sync --locked --no-dev --extra gui --group packaging
      - run: uv run --no-sync pyinstaller packaging/buysmarter-gui.spec --noconfirm

      - name: self-test the built app
        if: runner.os == 'Linux'
        run: dist/buysmarter/buysmarter --self-test
      - name: self-test the built app
        if: runner.os == 'macOS'
        run: dist/buysmarter.app/Contents/MacOS/buysmarter --self-test
      - name: self-test the built app
        if: runner.os == 'Windows'
        shell: pwsh  # a windowed exe: wait for it explicitly, then read its exit code
        run: |
          $p = Start-Process dist\buysmarter\buysmarter.exe -ArgumentList '--self-test' -Wait -PassThru
          $log = Join-Path $env:TEMP "buysmarter-selftest.log"  # selftest.FAILURE_LOG: no console to print to
          if ($p.ExitCode -ne 0 -and (Test-Path $log)) { Get-Content $log }
          exit $p.ExitCode

      - name: Ubuntu package, installed with apt and self-tested where it installed
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh "$(uv version --short)" dist/buysmarter out
          sudo apt-get install -y --no-install-recommends ./out/buysmarter_*.deb desktop-file-utils
          /opt/buysmarter/buysmarter --self-test
          desktop-file-validate /usr/share/applications/buysmarter.desktop

      - name: Windows setup, installed and uninstalled silently, self-tested where it installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc /Q "/DAppVersion=$(uv version --short)" "/DAppArch=${{ matrix.arch }}" "/DSourceDir=$PWD\dist\buysmarter" "/O$PWD\out" packaging\windows\buysmarter.iss
          if ($LASTEXITCODE) { exit 1 }
          $setup = (Get-ChildItem out\*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode) { "setup exited $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\buysmarter"  # {autopf} for a per-user install
          $t = Start-Process "$app\buysmarter.exe" -ArgumentList '--self-test' -Wait -PassThru
          $log = Join-Path $env:TEMP "buysmarter-selftest.log"
          if ($t.ExitCode -and (Test-Path $log)) { Get-Content $log }
          if ($t.ExitCode) { exit 1 }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3  # the uninstaller finishes in a copy of itself
          if ($u.ExitCode -or (Test-Path "$app\buysmarter.exe")) { "uninstall left the app behind"; exit 1 }

      - name: macOS disk image, mounted and self-tested from it
        if: runner.os == 'macOS'
        run: |
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          dmg="out/buysmarter-$(uv version --short)-macos-$arch.dmg"
          stage="$(mktemp -d)"
          ditto dist/buysmarter.app "$stage/buysmarter.app"  # keeps the framework symlinks
          ln -s /Applications "$stage/Applications"         # drag the app onto it
          mkdir -p out
          hdiutil create -volname buy-smarter -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F '\t' '/\/Volumes\// {print $NF}')"
          test -L "$mnt/Applications"
          "$mnt/buysmarter.app/Contents/MacOS/buysmarter" --self-test
          hdiutil detach "$mnt" || { sleep 5; hdiutil detach -force "$mnt"; }  # the self-test can leave the image busy for a moment

      - name: archive
        id: archive
        run: |
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          base="buysmarter-$(uv version --short)-${{ matrix.platform }}-$arch"
          mkdir -p out
          case "${{ matrix.platform }}" in
            linux) tar -C dist -czf "out/$base.tar.gz" buysmarter ;;
            windows) (cd dist && 7z a -tzip -bso0 "../out/$base.zip" buysmarter) ;;
            macos) ditto -c -k --keepParent dist/buysmarter.app "out/$base.app.zip" ;;  # keeps the framework symlinks
          esac
          du -h out/* >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

