version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown: { default-days: 7 }   # skip releases younger than a week (hijacked-release window)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
