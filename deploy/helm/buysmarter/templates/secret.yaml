{{- if not .Values.secret.existing }}
{{- $_ := required "secret.data.DATABASE_URL is required (or set secret.existing)" .Values.secret.data.DATABASE_URL }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buysmarter.fullname" . }}
  labels:
    {{- include "buysmarter.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # The migration hook runs before regular resources exist, so the Secret it reads is a hook too.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
