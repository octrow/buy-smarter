apiVersion: v1
kind: Pod
metadata:
  name: {{ include "buysmarter.fullname" . }}-test-ready
  labels:
    {{- include "buysmarter.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation  # kept until the next run, so `helm test --logs` can read it
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "buysmarter.podSecurityContext" . | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "buysmarter.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import urllib.request
          url = "http://{{ include "buysmarter.fullname" . }}:{{ .Values.service.port }}/ready"
          assert urllib.request.urlopen(url, timeout=10).status == 200, url
      securityContext:
        {{- include "buysmarter.containerSecurityContext" . | nindent 8 }}
