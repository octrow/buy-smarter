# Throwaway Postgres for the kind smoke test (CI). Lives in its own namespace: the official image starts as root,
# which the app namespace's Pod Security Standard "restricted" would reject.
apiVersion: v1
kind: Namespace
metadata:
  name: db
---
apiVersion: v1
kind: Namespace
metadata:
  name: buysmarter
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: db
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: buysmarter }
            - { name: POSTGRES_PASSWORD, value: buysmarter }
            - { name: POSTGRES_DB, value: buysmarter }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "buysmarter", "-h", "127.0.0.1"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: db
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
