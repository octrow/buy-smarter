[project]
name = "buysmarter"
version = "0.2.0"
description = "Explainable shopping assistant for Kazakhstan: ranks Kaspi, Ozon and OLX offers for your budget, city and must-haves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniil Petrov" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "redis",
    "typer",
    "fastmcp>=4.1",
    "openai",
    "claude-subprocess>=0.1.1",
    "market-sources[browser,impersonate,kimovil]>=0.2.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "taskiq[opentelemetry]>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[project.scripts]
buysmarter = "buysmarter.cli.main:app"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "fakeredis>=2.40.0",
    "mypy==2.4.0",
]

[project.urls]
Homepage = "https://github.com/octrow/buy-smarter"
Issues = "https://github.com/octrow/buy-smarter/issues"
Changelog = "https://github.com/octrow/buy-smarter/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buysmarter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: requires a reachable PostgreSQL (skipped when unavailable)",
]

[tool.uv.sources]
# Hack on them locally with: uv pip install -e ../pylibs/<name> (reverted by the next uv sync).
claude-subprocess = { git = "https://github.com/octrow/claude-cli", branch = "main" }
market-sources = { git = "https://github.com/octrow/market-sources", branch = "main" }

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Pure ranking logic: the per-module half of --strict (`strict` itself is global-only).
module = ["buysmarter.ranking.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Our own octrow/claude-cli ships no py.typed marker yet.
module = ["claude_cli", "claude_cli.*"]
ignore_missing_imports = true
