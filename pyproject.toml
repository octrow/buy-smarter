[project]
name = "buysmarter"
version = "0.3.1"
description = "Explainable shopping assistant for Kazakhstan: ranks Kaspi, Ozon and OLX offers for your budget, city and must-haves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniil Petrov" }]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "typer",
    "fastmcp>=4.1",
    "openai",
    "claude-subprocess>=0.1.1",
    "market-sources[browser,impersonate,kimovil]>=0.4.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "aiosqlite>=0.22.1",
    "platformdirs>=4.10.1",
    "keyring>=25",
]

[project.optional-dependencies]
# The multi-user server: HTTP API, taskiq worker on Redis, Postgres, Prometheus /metrics.
server = [
    "fastapi",
    "uvicorn",
    "asyncpg",
    "redis",
    "taskiq[opentelemetry]>=0.13.0",
    "taskiq-redis>=1.2.4",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "prometheus-client",
]

# The desktop app (ADR 0001): `buysmarter gui`.
# Essentials: Widgets/Gui/Core only, without WebEngine and the other addons (hundreds of MB).
gui = [
    "PySide6-Essentials>=6.8",
    "qtawesome>=1.4.2",
]

[project.scripts]
buysmarter = "buysmarter.cli.main:main"
buysmarter-gui = "buysmarter.gui.__main__:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "fakeredis>=2.40.0",
    "mypy==2.4.0",
    "complexipy==8.0.1",
    "pytest-cov==7.1.0",
    "pytest-qt>=4.5.0",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[project.urls]
Homepage = "https://github.com/octrow/buy-smarter"
Issues = "https://github.com/octrow/buy-smarter/issues"
Changelog = "https://github.com/octrow/buy-smarter/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buysmarter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/buysmarter/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.per-file-ignores]
# The generated QSS reads best as one rule per line.
"src/buysmarter/gui/theme/__init__.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "server: needs the [server] extra (fastapi, redis, taskiq, ...)",
]

[tool.coverage.run]
source = ["src/buysmarter"]
branch = true
# Entry point; the migrations run in subprocesses (tests/storage), out of coverage's sight.
omit = [
    "src/buysmarter/mcp_server/__main__.py",
    "src/buysmarter/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.uv.sources]
# Hack on them locally with: uv pip install -e ../pylibs/<name> (reverted by the next uv sync).
claude-subprocess = { git = "https://github.com/octrow/claude-cli", branch = "main" }
market-sources = { git = "https://github.com/octrow/market-sources", branch = "main" }

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# Our own octrow/claude-cli ships no py.typed marker yet.
module = ["claude_cli", "claude_cli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qtawesome ships no type hints.
module = ["qtawesome", "qtawesome.*"]
ignore_missing_imports = true
